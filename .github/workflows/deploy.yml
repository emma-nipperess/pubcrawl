name: Test & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # unit tests + database tests (migrations applied to embedded Postgres with RLS)
      - run: npm test
      - name: E2E (production build behind a Pages-like server)
        run: |
          npx playwright install --with-deps chromium
          PW_CHANNEL=chromium npm run test:e2e

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Public values (the anon/publishable key is designed to be public).
          # Set them as repository *Variables* or *Secrets* — either works.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          BASE_OVERRIDE: ${{ vars.VITE_BASE_PATH }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)"; exit 1
          fi
          # Base path: explicit override > custom domain or <owner>.github.io repo ("/") > "/<repo>/"
          owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          repo_lc=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          if [ -n "$BASE_OVERRIDE" ]; then BASE="$BASE_OVERRIDE"
          elif [ -n "$CUSTOM_DOMAIN" ] || [ "$repo_lc" = "$owner_lc.github.io" ]; then BASE="/"
          else BASE="/$REPO_NAME/"; fi
          echo "Building with base path: $BASE"
          VITE_BASE_PATH="$BASE" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
